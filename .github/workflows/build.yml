name: build
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "21"
            mc_versions: ["1.21", "1.21.6"]
          - java: "25"
            mc_versions: ["26.1", "26.2"]

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: setup gradle with dependency caching
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build and upload minecraft versions
        run: |
          for mc in ${{ toJSON(matrix.mc_versions) }}; do
            echo "Building Minecraft $mc..."
            ./gradlew :$mc:build
          done

      - name: upload all jars
        uses: actions/upload-artifact@v7
        with:
          name: betterhud-java-${{ matrix.java }}
          path: versions/*/build/libs/*.jar